global:
  smtp_smarthost: 'localhost:25'
  smtp_from: 'alertmanager@devops-autopilot.local'

route:
  receiver: 'n8n-incident-webhook'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Kritik alertler — anında n8n'e gönder
    - match:
        severity: critical
      receiver: 'n8n-incident-webhook'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alertler — 2dk bekle, sonra gönder
    - match:
        severity: warning
      receiver: 'n8n-incident-webhook'
      group_wait: 2m
      repeat_interval: 6h

    # n8n kendi alertleri
    - match:
        service: n8n
      receiver: 'n8n-internal-webhook'

receivers:
  # ── Workflow 2: Incident Response Workflow ──
  - name: 'n8n-incident-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/prometheus-alert'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'admin'
            password: 'n8n_secure_2026'

  - name: 'n8n-internal-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/n8n-self-alert'
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
