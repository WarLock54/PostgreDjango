name: 🚀 DevOps Autopilot CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        working-directory: myproject
        run: |
          pip install -r ../requirements.txt

      - name: 🗄️ Migrate
        working-directory: myproject
        env:
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DJANGO_SECRET_KEY: test-secret-key
          DEBUG: 'True'
        run: python manage.py migrate

      - name: ✅ Run Tests
        working-directory: myproject
        env:
          DB_HOST: localhost
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres123
          DJANGO_SECRET_KEY: test-secret-key
          DEBUG: 'True'
        run: python manage.py test myapp --verbosity=2

  notify-n8n:
    name: 🤖 n8n CI/CD Workflow Tetikle
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
      - name: 📤 Send to n8n
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}/webhook/github-pr-cicd" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "ci_completed",
              "status": "success",
              "repo": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }'
